name: Publish to PyPI

# Publishes the Python SDK (capiumbrowser-python/) to PyPI as `capiumbrowser` via Trusted
# Publishing (OIDC) — no API token/secret stored. Fires when you publish a GitHub Release
# (tag). Also runnable manually from the Actions tab.
#
# Lives at the capiumbrowser/ product root: the public capzy-ai/capiumbrowser repo mirrors
# that folder, so this .github/ is the mirrored repo's root .github/ and runs there.
#
# One-time PyPI setup (https://pypi.org/manage/account/publishing/, "pending publisher"):
#   PyPI Project Name : capiumbrowser
#   Owner             : capzy-ai
#   Repository name   : capiumbrowser
#   Workflow name     : publish-pypi.yml
#   Environment name  : pypi
# Then create a GitHub environment named "pypi" under Settings > Environments.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test + build sdist + wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capiumbrowser-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pytest tests -q
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: capiumbrowser-python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
